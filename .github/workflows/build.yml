name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Dynamic Bangs
        run: python3 Tools/build-local.py
      - name: Run Tests
        run: bash Tools/run-tests.sh
